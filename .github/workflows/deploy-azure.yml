name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'Power Automate flows/**'
  workflow_dispatch: { }

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  ACR_NAME: gkoutlooksyncacr
  RESOURCE_GROUP: RG-Outlook-sync
  CONTAINER_APP_NAME: outlook-sync
  IMAGE_NAME: outlook-sync

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: 'pyproject.toml'
      - name: Run tests
        run: |
          pip install -r requirements-poetry.txt
          python3 -m venv .venv
          source .venv/bin/activate
          poetry install --with test
          # GitHub integration tests need a real PAT and test repo, so they are skipped here (dummy values only
          # satisfy the import-time checks of the test modules)
          pytest tests -k "not github"
        env:
          GITHUB_INTEGRATION_TEST_PAT: dummy
          GITHUB_INTEGRATION_TEST_OWNER_REPO_BRANCH: dummy/dummy/dummy

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for the OIDC login to Azure
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OUTLOOKSYNC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OUTLOOKSYNC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OUTLOOKSYNC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            if curl -fsS "https://$FQDN/health"; then exit 0; fi
            sleep 10
          done
          echo "Health check failed" && exit 1
